name: Atualizar catálogo
on:
  schedule:
    - cron: '17 9 * * *'   # todo dia, 06:17 em Brasília
  workflow_dispatch:
env:
  EDICAO: '2026'   # troque para o ano da edição atual
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: github-pages   # required by deploy-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: scraper/requirements.txt}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r scraper/requirements.txt
      - name: Cache (PDFs e vetores de palavras)
        uses: actions/cache@v4
        with:
          path: scraper/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-
      - name: Coletar e processar
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scraper/run.py
      - name: Commit se houver mudança
        id: c
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then echo "changed=false" >> $GITHUB_OUTPUT; echo "Sem mudanças."; else
            git commit -m "Atualiza catálogo ($(date -u +%F))"; git push; echo "changed=true" >> $GITHUB_OUTPUT; fi
      # pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here
      - if: steps.c.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.c.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with: {path: site}
      - if: steps.c.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
